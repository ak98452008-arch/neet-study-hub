<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyStark - Free Batches, Lectures & PDFs</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen flex flex-col" x-data="appData()">

  <!-- Navbar -->
  <header class="bg-gray-800 border-b border-gray-700 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3 cursor-pointer" @click="currentTab = 'home'">
        <div class="bg-indigo-600 text-white p-2 rounded-lg font-bold text-xl flex items-center justify-center w-10 h-10">
          SS
        </div>
        <span class="text-xl font-extrabold tracking-wide text-white">Study<span class="text-indigo-400">Stark</span></span>
      </div>

      <nav class="hidden md:flex space-x-6 font-medium text-sm">
        <button @click="currentTab = 'home'" :class="currentTab === 'home' ? 'text-indigo-400' : 'text-gray-300 hover:text-white'">Home</button>
        <button @click="currentTab = 'batches'" :class="currentTab === 'batches' ? 'text-indigo-400' : 'text-gray-300 hover:text-white'">Batches</button>
        <button @click="currentTab = 'pdfs'" :class="currentTab === 'pdfs' ? 'text-indigo-400' : 'text-gray-300 hover:text-white'">PDF Notes</button>
      </nav>

      <div class="flex items-center space-x-3">
        <button @click="openAuthModal = true" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg font-medium text-sm transition">
          <i class="fa-solid fa-key mr-1"></i> Key / Auth
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6">

    <!-- HOME TAB -->
    <template x-if="currentTab === 'home'">
      <div class="space-y-8">
        <!-- Hero Banner -->
        <div class="bg-gradient-to-r from-indigo-900 via-purple-900 to-gray-800 rounded-2xl p-6 md:p-10 border border-indigo-500/20 shadow-xl">
          <div class="max-w-2xl">
            <span class="bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 text-xs px-3 py-1 rounded-full font-semibold">100% Free Access</span>
            <h1 class="text-3xl md:text-5xl font-extrabold mt-3 text-white leading-tight">Learn More. Achieve More.</h1>
            <p class="text-gray-300 mt-3 text-sm md:text-base">Access high-quality study materials, video lectures, batch modules, and practice PDFs — all in one place.</p>
            <div class="mt-6 flex flex-wrap gap-3">
              <button @click="currentTab = 'batches'" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-lg font-semibold text-sm transition">
                Explore Batches <i class="fa-solid fa-arrow-right ml-1"></i>
              </button>
            </div>
          </div>
        </div>

        <!-- Batches Grid -->
        <div>
          <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
            <i class="fa-solid fa-graduation-cap text-indigo-400"></i> Featured Batches
          </h2>
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <template x-for="batch in batches" :key="batch.id">
              <div class="bg-gray-800 rounded-xl overflow-hidden border border-gray-700 hover:border-indigo-500/50 transition flex flex-col justify-between">
                <div class="p-4">
                  <h3 class="font-bold text-lg text-white" x-text="batch.title"></h3>
                  <p class="text-gray-400 text-xs mt-1" x-text="batch.description"></p>
                </div>
              </div>
            </template>
          </div>
        </div>
      </div>
    </template>
  </main>

  <script>
    function appData() {
      return {
        currentTab: 'home',
        openAuthModal: false,
        batches: [
          { id: 1, title: "Lakshya JEE 2026", description: "Class 12 Main & Advanced" },
          { id: 2, title: "Yakeen NEET 2026", description: "NEET UG Repeater Batch" }
        ]
      }
    }
  </script>
</body>
</html>
