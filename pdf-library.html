<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>PDF Study Library | Ayush9845</title><style>:root{color-scheme:dark;--bg:#0b1120;--panel:#121c30;--line:#293750;--muted:#aab7ce;--text:#f5f7fb;--accent:#9cafff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#17294a 0,transparent 45%),var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,sans-serif}.wrap{max-width:900px;margin:auto;padding:24px 16px 56px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:25px}.logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#9cafff,#7ce8d2);color:#101827;display:grid;place-items:center;font-weight:900}.muted{color:var(--muted)}h1{font-size:clamp(28px,5vw,42px);line-height:1.1;margin:8px 0}.search{width:100%;padding:14px;border-radius:12px;background:#0b1425;border:1px solid #3b4c68;color:var(--text);font:inherit;margin:18px 0}.list{display:grid;gap:12px}.item{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:17px;display:flex;gap:12px;align-items:center;justify-content:space-between}.item h2{font-size:17px;margin:0 0 4px}.item p{font-size:13px;color:var(--muted);margin:0}.button{display:inline-flex;background:var(--accent);color:#101827;text-decoration:none;font-weight:750;padding:10px 14px;border-radius:10px;white-space:nowrap}.status{padding:16px;border:1px solid var(--line);border-radius:12px;color:var(--muted)}.small{font-size:13px}@media(max-width:500px){.item{align-items:flex-start;flex-direction:column}.button{width:100%;justify-content:center}}</style></head><body><main class="wrap"><header class="brand"><div class="logo">A</div><div><strong>AYUSH9845 · STUDY HUB</strong><div class="muted small">Student PDF Library</div></div></header><h1>Study materials.</h1><p class="muted">Browse published notes and open them in your browser's PDF viewer.</p><input id="search" class="search" type="search" placeholder="Search title or subject…" aria-label="Search PDFs"><div id="list" class="list"><div class="status">Loading PDFs…</div></div><p class="muted small" style="margin-top:24px">For personal study. Browser-based viewing cannot completely prevent saving, screenshots, or copying.</p></main><script>
// Replace with your deployed Worker base URL (do not include /api at the end).
const API_BASE='https://YOUR-WORKER-NAME.YOUR-SUBDOMAIN.workers.dev';let allPdfs=[];const list=document.getElementById('list');function render(){const q=document.getElementById('search').value.trim().toLowerCase();const rows=allPdfs.filter(p=>(p.title+' '+p.subject).toLowerCase().includes(q));list.replaceChildren();if(!rows.length){const empty=document.createElement('div');empty.className='status';empty.textContent=allPdfs.length?'No PDFs match your search.':'No PDFs have been published yet.';list.append(empty);return}for(const p of rows){const card=document.createElement('article');card.className='item';const info=document.createElement('div');const h=document.createElement('h2');h.textContent=p.title;const meta=document.createElement('p');meta.textContent=`${p.subject} · ${(p.size_bytes/1024/1024).toFixed(2)} MB`;info.append(h,meta);const link=document.createElement('a');link.className='button';link.href=API_BASE+'/api/pdfs/'+encodeURIComponent(p.id)+'/content';link.target='_blank';link.rel='noopener';link.textContent='Read PDF ↗';card.append(info,link);list.append(card)}}async function init(){if(API_BASE.includes('YOUR-WORKER-NAME')){list.textContent='Setup required: edit API_BASE in pdf-library.html to your Worker URL.';return}try{const r=await fetch(API_BASE+'/api/pdfs');const data=await r.json();if(!r.ok)throw new Error(data.error||'Could not load library');allPdfs=data.pdfs||[];render()}catch(e){list.textContent='Could not load the library. Check the Worker URL and ALLOWED_ORIGIN setting.'}}document.getElementById('search').addEventListener('input',render);init();
</script></body></html>
